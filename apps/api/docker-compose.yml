services:
  postgres:
    image: postgres:16-alpine
    container_name: sentience-postgres
    environment:
      POSTGRES_USER: sentience
      POSTGRES_PASSWORD: sentience
      POSTGRES_DB: sentience
    ports:
      - "5433:5432"
    volumes:
      - sentience-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentience"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  sentience-pgdata:
