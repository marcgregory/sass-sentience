services:
  postgres:
    image: postgres:16-alpine
    container_name: sentience-postgres
    environment:
      POSTGRES_USER: sentience
      POSTGRES_PASSWORD: sentience
      POSTGRES_DB: sentience
    ports:
      - "5433:5432"
    volumes:
      - sentience-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentience"]
      interval: 5s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: sentience-mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./docker/mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    restart: unless-stopped

volumes:
  sentience-pgdata:
  mosquitto_data:
  mosquitto_log:
