# Mosquitto configuration for local Sentience device simulation.
#
# This setup is for DEVELOPMENT ONLY. For production:
# - Enable authentication (password_file / auth_plugin)
# - Enable TLS on both ports
# - Restrict anonymous access (allow_anonymous false)
# - Use non-default credentials

# ─── Listeners ──────────────────────────────────────────────────────

# Standard MQTT — used by the device simulator and CLI tools
listener 1883
protocol mqtt

# WebSocket — used by browser-based MQTT clients for debugging
listener 9001
protocol websockets

# ─── Security (development only) ────────────────────────────────────

# Allow anonymous connections for local development
allow_anonymous true

# ─── Persistence ────────────────────────────────────────────────────

persistence true
persistence_location /mosquitto/data/

# ─── Logging ────────────────────────────────────────────────────────

log_dest stdout
log_type all
connection_messages true
log_timestamp true
